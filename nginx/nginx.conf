user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'upstream: $upstream_addr ($upstream_response_time s)';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Gzip compression for static text/JSON assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # =========================================================================
    # Upstream: 3 Replicas of the Django ASGI Backend
    # =========================================================================
    upstream backend_cluster {
        # ip_hash maintains session affinity per client IP while distributing load
        ip_hash;
        server backend-1:8000 max_fails=3 fail_timeout=10s;
        server backend-2:8000 max_fails=3 fail_timeout=10s;
        server backend-3:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # =========================================================================
    # Upstream: Frontend Service (Vite React)
    # =========================================================================
    upstream frontend_server {
        server frontend:5173;
    }

    server {
        listen 80;
        server_name localhost _;

        client_max_body_size 50M;

        # Standard Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # ---------------------------------------------------------------------
        # 1. API Endpoints: Load-balanced across all 3 backend replicas
        # ---------------------------------------------------------------------
        location /api/ {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ---------------------------------------------------------------------
        # 2. WebSocket Endpoints: Load-balanced with connection upgrade support
        #    Channel Layer via Redis synchronizes all rooms across all replicas
        # ---------------------------------------------------------------------
        location /ws/ {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Extended timeouts for persistent collaborative drawing sessions
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ---------------------------------------------------------------------
        # 3. Django Administration Portal
        # ---------------------------------------------------------------------
        location /admin/ {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------------------------------------------------------------------
        # 4. Frontend Application & Vite HMR WebSocket proxy
        # ---------------------------------------------------------------------
        location / {
            proxy_pass http://frontend_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------------------------------------------------------------------
        # 5. Health Check Endpoint (used by Jenkins CI/CD pipeline & monitors)
        # ---------------------------------------------------------------------
        location /healthz {
            access_log off;
            return 200 '{"status":"healthy","service":"nginx-load-balancer","replicas":3}\n';
            add_header Content-Type application/json;
        }
    }
}

